# Fuentes del agente de ganadería bovina de carne.
# - priority 1: se usan en la primera versión. priority 2: se suman si hay tiempo/cuota.
# - url_verified: false  => el primer paso del agente (probe) comprueba cada URL
#   y detecta feed/API automáticamente. Ninguna URL de feed está asumida acá.
# - country: ISO-2. null = organismo global. EU se trata como región.
# - access: rss | web | pdf | api  (cómo se espera consumirla; el probe lo confirma)

sources:
  # ---------------- Argentina: qué pasa hoy ----------------
  - slug: senasa
    name: SENASA (novedades publicadas en argentina.gob.ar)
    url: https://www.argentina.gob.ar/noticias
    no_feed: true   # el feed del portal es de todo el Estado (trae avisos de búsqueda de personas, etc.)
    country: AR
    type: gobierno
    access: web
    priority: 1
    url_verified: false
    justification: Fuente oficial de normativa y novedades de trazabilidad y sanidad animal; se filtran solo las notas del sector ganadero.

  - slug: inta
    name: INTA
    url: https://inta.gob.ar/noticias
    no_feed: true
    country: AR
    type: instituto_tecnico
    access: web
    priority: 1
    url_verified: false
    justification: Referente técnico nacional; publica noticias e informes sobre prácticas productivas y adopción de tecnología.

  - slug: ipcva
    name: IPCVA (Instituto de Promoción de la Carne Vacuna Argentina)
    url: https://www.ipcva.com.ar
    country: AR
    type: gremio
    access: web
    priority: 1
    url_verified: false
    justification: Estadísticas de faena, consumo y exportaciones y estudios sectoriales de la cadena.

  - slug: mag
    name: Mercado Agroganadero (Cañuelas)
    url: https://www.mercadoagroganadero.com.ar
    country: AR
    type: gremio
    access: web
    priority: 1
    url_verified: false
    justification: Precios y volúmenes de hacienda en tiempo real; sirve para medir capacidad financiera y contexto de mercado.

  - slug: bcr
    name: Bolsa de Comercio de Rosario
    url: https://www.bcr.com.ar
    country: AR
    type: gremio
    access: web
    priority: 2
    url_verified: false
    justification: Informes económicos sectoriales con análisis de costos, márgenes y financiamiento.

  - slug: datos-gob-ar
    name: Portal de Datos Abiertos de Argentina
    url: https://datos.gob.ar
    country: AR
    type: gobierno
    access: api
    priority: 3   # no respondió en el probe y aporta datos tabulares, no texto: fuera de la corrida por defecto
    url_verified: false
    justification: Datos abiertos con acceso por API, ideales para una recolección repetible y verificable.

  # ---------------- Medios especializados (tendencias y proveedores) ----------------
  - slug: valorcarne
    name: Valor Carne
    url: https://www.valorcarne.com.ar
    country: AR
    type: medio
    access: rss
    priority: 1
    url_verified: false
    justification: Cobertura diaria de la cadena de carne vacuna; detecta novedades de tecnología, mercado y regulación.

  - slug: chacra
    name: Revista Chacra
    url: https://www.revistachacra.com.ar
    country: AR
    type: medio
    access: rss
    priority: 1
    url_verified: false
    justification: Publicación técnica del agro con notas sobre manejo, genética y tecnología aplicada.

  - slug: agrofy-news
    name: Agrofy News
    url: https://news.agrofy.com.ar
    country: AR
    type: medio
    access: rss
    priority: 2
    url_verified: false
    justification: Seguimiento de agtech y proveedores de tecnología para el productor.

  - slug: campo-en-accion
    name: Campo en Acción
    url: https://www.campoenaccion.com
    country: AR
    type: medio
    access: rss
    priority: 2
    url_verified: false
    justification: Noticias de actualidad ganadera y casos de adopción tecnológica.

  # ---------------- Benchmarks internacionales: qué puede venir ----------------
  - slug: usda-gain-ar
    name: USDA GAIN - Argentina Livestock and Products Annual
    url: https://www.fas.usda.gov/data/argentina-livestock-and-products-annual
    country: US
    type: organismo_internacional
    access: pdf
    priority: 3   # HTTP 403: USDA bloquea el acceso automatizado desde GitHub; no se intenta eludir
    url_verified: false
    justification: Reporte anual del agregado agrícola de EE.UU. sobre la ganadería argentina (producción, tecnología, política); base comparable con los demás países.

  - slug: usda-gain-br
    name: USDA GAIN - Brazil Livestock and Products Annual
    url: https://www.fas.usda.gov/data/brazil-livestock-and-products-annual
    country: US
    type: organismo_internacional
    access: pdf
    priority: 3   # HTTP 403: USDA bloquea el acceso automatizado desde GitHub; no se intenta eludir
    url_verified: false
    justification: Mismo formato que el de Argentina, para comparar con Brasil, principal competidor exportador.

  - slug: usda-gain-uy
    name: USDA GAIN - Uruguay Livestock and Products Annual
    url: https://www.fas.usda.gov/data/uruguay-livestock-and-products-annual
    country: US
    type: organismo_internacional
    access: pdf
    priority: 3   # HTTP 403: USDA bloquea el acceso automatizado desde GitHub; no se intenta eludir
    url_verified: false
    justification: Mismo formato que el de Argentina, para comparar con Uruguay (trazabilidad individual obligatoria).

  - slug: usda-gain-au
    name: USDA GAIN - Australia Livestock and Products Annual
    url: https://www.fas.usda.gov/data/australia-livestock-and-products-annual
    country: US
    type: organismo_internacional
    access: pdf
    priority: 3   # HTTP 403 (ver usda-gain-ar)
    url_verified: false
    justification: Mismo formato que el de Argentina, para comparar con Australia.

  - slug: mla
    name: Meat & Livestock Australia
    url: https://www.mla.com.au
    country: AU
    type: gremio
    access: web
    priority: 1
    url_verified: false
    justification: Referente mundial en adopción de ganadería de precisión, genética y trazabilidad (sistema NLIS).

  - slug: inac
    name: INAC (Instituto Nacional de Carnes, Uruguay)
    url: https://www.inac.uy
    country: UY
    type: gobierno
    access: web
    priority: 1
    url_verified: false
    justification: Uruguay tiene trazabilidad individual obligatoria; benchmark cercano y comparable en sistemas pastoriles.

  - slug: embrapa
    name: Embrapa (Brasil)
    url: https://www.embrapa.br
    country: BR
    type: instituto_tecnico
    access: web
    priority: 1
    url_verified: false
    justification: Principal competidor exportador; referencia en intensificación, genética y reducción de emisiones.

  - slug: fao
    name: FAO (ganadería)
    url: https://www.fao.org/animal-production
    country: null
    type: organismo_internacional
    access: web
    priority: 2
    url_verified: false
    justification: Visión global de tendencias de producción, sostenibilidad y emisiones del sector ganadero.

  - slug: eu-deforestation
    name: Comisión Europea - Reglamento contra la deforestación
    url: https://environment.ec.europa.eu/topics/forests/deforestation/regulation-deforestation-free-products_en
    country: EU
    type: gobierno
    access: web
    priority: 2
    url_verified: false
    justification: Normativa que condiciona el acceso de la carne a la UE y exige trazabilidad; impulsa adopción a mediano plazo.

  # ---------------- Benchmarks adicionales (reemplazan la cobertura que no da USDA) ----------------
  - slug: beef-central
    name: Beef Central (Australia)
    url: https://www.beefcentral.com
    country: AU
    type: medio
    access: rss
    priority: 1
    url_verified: false
    justification: Medio especializado australiano; cubre adopción de tecnología, trazabilidad (NLIS) y mercado, con RSS.

  - slug: inia-uy
    name: INIA (Instituto Nacional de Investigación Agropecuaria, Uruguay)
    url: https://www.inia.uy
    country: UY
    type: instituto_tecnico
    access: web
    priority: 1
    url_verified: false
    justification: Investigación ganadera uruguaya (genética, pasturas, eficiencia); referencia técnica comparable con INTA.

  - slug: portal-dbo
    name: Portal DBO (Brasil)
    url: https://www.portaldbo.com.br
    country: BR
    type: medio
    access: web
    priority: 1
    url_verified: false
    justification: Medio brasileño especializado en ganadería de carne; cubre intensificación, confinamiento y tecnología.

  - slug: abiec
    name: ABIEC (Asociación de Exportadores de Carne, Brasil)
    url: https://www.abiec.com.br
    country: BR
    type: gremio
    access: web
    priority: 2
    url_verified: false
    justification: Cifras y posición del sector exportador brasileño, principal competidor de Argentina.

  - slug: mgap-uy
    name: MGAP Uruguay (Ministerio de Ganadería, Agricultura y Pesca)
    url: https://www.gub.uy/ministerio-ganaderia-agricultura-pesca
    country: UY
    type: gobierno
    access: web
    priority: 2
    url_verified: false
    justification: Fuente oficial del sistema de trazabilidad individual obligatoria (SNIG) y políticas del sector.

  - slug: bichos-de-campo
    name: Bichos de Campo
    url: https://bichosdecampo.com
    country: AR
    type: medio
    access: rss
    priority: 1
    url_verified: false
    justification: Cobertura detallada de normativa SENASA, trazabilidad, costos y debate del sector; complementa las fuentes oficiales.
