name: Agente de ganadería

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      modo:
        description: "probe = solo probar las fuentes | run = correr el agente completo"
        type: choice
        options: [probe, run]
        default: probe

jobs:
  agente:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Probar fuentes (no usa claves)
        if: github.event_name == 'workflow_dispatch' && inputs.modo == 'probe'
        run: python -m agent.probe

      - name: Ejecutar agente completo
        if: github.event_name == 'schedule' || inputs.modo == 'run'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m agent.run
